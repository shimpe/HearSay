# OpenAL Soft settings for HearSay Studio, read from the program's folder: as alsoft.ini on Windows, alsoft.conf
# elsewhere. Short mixing updates keep the delay from a key to its sound small for the live notes; the system may
# make them longer (Windows mixes every 10 ms in shared mode). Without this file OpenAL Soft mixes 960 samples at a
# time with three updates of buffering: 60 ms of delay, and an update nearly as long as the four live buffers together,
# which then keep running dry.
[general]
period_size = 256
periods = 3
